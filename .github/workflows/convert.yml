name: Convert Rules

on:
  push:
    branches:
      - main
    paths:
      - 'src/**.list'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: convert-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sing-box
        run: |
          echo "Installing sing-box via go install..."
          go install -v -tags with_quic,with_dhcp,with_wireguard,with_shadowsocksr,with_ech,with_utls,with_reality_server,with_clash_api,with_gvisor github.com/sagernet/sing-box/cmd/sing-box@v1.11.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/sing-box" version

      - name: Convert and compile rules
        run: python scripts/convert_rules.py --sing-box "$(go env GOPATH)/bin/sing-box"

      - name: Commit and push generated files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add rule_json/ rule_srs/

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update rules [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
